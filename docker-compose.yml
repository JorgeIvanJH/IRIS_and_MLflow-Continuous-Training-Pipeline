services:
  iris:
    build:
      context: . # Path to the directory containing the Dockerfile
      dockerfile: Dockerfile
    container_name: iris-experimentation
    env_file:
      - .env
    ports:
      - "1972:1972"    # SuperServer port
      - "52773:52773"  # Management Portal/Web Gateway
    environment:
      TZ: ${TZ:?TZ is required}
      MLFLOW_TRACKING_URI: "http://localhost:${MLFLOW_PORT:?MLFLOW_PORT is required}"
      MLFLOW_TRACKING_URI_IRIS: "http://mlflow:${MLFLOW_PORT:?MLFLOW_PORT is required}"
    #   - ISC_DATA_DIRECTORY=/dur/iconfig  # Data directory inside the container (outside install dir)
    volumes:
      - ./dur/.:/dur:rw # map with read-write permissions
    restart: always # Always restart the container if it stops (unless explicitly stopped)
    healthcheck:
      test: ["CMD", "iris", "session", "iris", "-U", "%SYS", "##class(SYS.Database).GetMountedSize()"] # Health check command
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: --after "/usr/irissys/iris_autoconf.sh" # Run autoconf script after startup

  postgres: # ONLY FOR MLflow experimentation
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:?TZ is required}
    volumes:
      - ./dur/sandbox/mlflow/postgres:/var/lib/postgresql/data:rw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: ${TZ:?TZ is required}
    volumes:
      - ./dur/sandbox/mlflow/minio:/data:rw
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT:?MINIO_PORT is required}/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  create-bucket:
    image: minio/mc:latest
    container_name: mlflow-create-bucket
    environment:
      TZ: ${TZ:?TZ is required}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set myminio "http://${MINIO_HOST:?MINIO_HOST is required}:${MINIO_PORT:?MINIO_PORT is required}" \
          "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}" "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
        mc mb --ignore-existing "myminio/${MINIO_BUCKET:?MINIO_BUCKET is required}"
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v${MLFLOW_VERSION:?MLFLOW_VERSION is required}
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow-server,localhost,127.0.0.1"
      MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      MLFLOW_S3_ENDPOINT_URL: "http://${MINIO_HOST:?MINIO_HOST is required}:${MINIO_PORT:?MINIO_PORT is required}"
      MLFLOW_ARTIFACTS_DESTINATION: "s3://${MINIO_BUCKET:?MINIO_BUCKET is required}"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION is required}
      MLFLOW_S3_IGNORE_TLS: "true"
      MLFLOW_HOST: ${MLFLOW_HOST:?MLFLOW_HOST is required}
      MLFLOW_PORT: ${MLFLOW_PORT:?MLFLOW_PORT is required}
      TZ: ${TZ:?TZ is required}
    command:
      - /bin/bash
      - -ec
      - |
        pip install --no-cache-dir psycopg2-binary boto3
        exec mlflow server \
          --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}" \
          --artifacts-destination "$${MLFLOW_ARTIFACTS_DESTINATION}" \
          --serve-artifacts \
          --host "$${MLFLOW_HOST}" \
          --port "$${MLFLOW_PORT}" \
          --allowed-hosts "mlflow:$${MLFLOW_PORT},mlflow-server:$${MLFLOW_PORT},localhost:*,127.0.0.1:*"
    ports:
      - "${MLFLOW_PORT:?MLFLOW_PORT is required}:${MLFLOW_PORT:?MLFLOW_PORT is required}"
    # optional: keep mlflow logs in that folder
    # (docker logs is usually enough, so this is optional)
